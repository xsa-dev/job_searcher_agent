model:
  default: MiniMaxAI/MiniMax-M2
  provider: custom
  base_url: https://foundation-models.api.cloud.ru/v1
  api_mode: chat_completions

# Two proxies, both only in .env:
#   HTTPS_PROXY  — LLM (cloud.ru)
#   BROWSER_PROXY — Playwright / hh.ru (Russian IP)
# Playwright subprocess gets BROWSER_PROXY as its HTTP(S)_PROXY so it does
# not inherit the LLM proxy. Hermes expands ${BROWSER_PROXY} from profile .env.

mcp_servers:
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest"]
    idle_timeout_seconds: 900
    max_lifetime_seconds: 86400
    env:
      HTTPS_PROXY: "${BROWSER_PROXY}"
      HTTP_PROXY: "${BROWSER_PROXY}"
      ALL_PROXY: "${BROWSER_PROXY}"

skills:
  config:
    jobsearcher:
      max_applications: "5"
      use_recommended: "true"
      salary_threshold: "0.8"
      city: "Москва"
      vacancy_search_query: "Python Backend разработчик"
      experience: "between1And3"

cron:
  wrap_response: true
  model: MiniMaxAI/MiniMax-M2
  model_provider: custom

display:
  tool_progress: "new"

agent:
  max_turns: none
