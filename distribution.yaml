name: job-searcher
version: 1.0.0
description: "HH.ru job search + auto-apply: login, recommended feed, Russian cover letters, duplicate skip, apply cap"
hermes_requires: ">=0.12.0"
author: "Aleksey Savin"
license: "MIT"

env_requires:
  - name: OPENAI_API_KEY
    description: "API key for cloud.ru Foundation Models (OpenAI-compatible MiniMax)"
    required: true
  - name: HH_LOGIN
    description: "HeadHunter account email"
    required: true
  - name: HH_PASSWORD
    description: "HeadHunter account password. Never paste into chat."
    required: true
  - name: RESUME_FULL_NAME
    description: "Candidate full name for cover-letter signature"
    required: true
  - name: RESUME_EMAIL
    description: "Contact email for cover letters"
    required: false
    default: ""
  - name: RESUME_PHONE
    description: "Contact phone for cover letters"
    required: false
    default: ""
  - name: RESUME_TITLE
    description: "Headline / target role, e.g. Python Backend Developer"
    required: false
    default: "Python Backend Developer"
  - name: RESUME_TAGS
    description: "Comma-separated skills used in letters"
    required: false
    default: "Python, Django, FastAPI"
  - name: RESUME_SUMMARY
    description: "Short professional summary for letters"
    required: false
    default: ""
  - name: DESIRED_SALARY
    description: "Minimum desired salary in RUB (used for 80% skip threshold). Empty = no filter."
    required: false
    default: ""
